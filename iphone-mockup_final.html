<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 15 Pro Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --iphone-width: min(375px, 90vw);
            --iphone-height: calc(var(--iphone-width) * 2.16);
            --border-radius: calc(var(--iphone-width) * 0.14);
            --bezel: calc(var(--iphone-width) * 0.025);
            --dynamic-island-width: calc(var(--iphone-width) * 0.32);
            --dynamic-island-height: calc(var(--iphone-width) * 0.095);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .iphone-container {
            position: relative;
        }

        /* iPhone Dış Çerçeve - Titanyum */
        .iphone-frame {
            position: relative;
            width: var(--iphone-width);
            height: var(--iphone-height);
            background: linear-gradient(145deg, #2a2a2e 0%, #1c1c1e 50%, #2a2a2e 100%);
            border-radius: var(--border-radius);
            padding: var(--bezel);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.1),
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 100px rgba(100, 100, 255, 0.1),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Titanyum Kenar Efekti */
        .iphone-frame::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.15) 0%, 
                rgba(255,255,255,0.05) 25%,
                rgba(0,0,0,0.1) 50%,
                rgba(255,255,255,0.05) 75%,
                rgba(255,255,255,0.1) 100%);
            border-radius: calc(var(--border-radius) + 1px);
            z-index: -1;
        }

        /* Yan Butonlar */
        .side-button {
            position: absolute;
            background: linear-gradient(90deg, #3a3a3c, #2c2c2e, #3a3a3c);
            border-radius: 2px;
        }

        .volume-up {
            left: -3px;
            top: 18%;
            width: 3px;
            height: calc(var(--iphone-width) * 0.08);
        }

        .volume-down {
            left: -3px;
            top: 26%;
            width: 3px;
            height: calc(var(--iphone-width) * 0.08);
        }

        .silent-switch {
            left: -3px;
            top: 12%;
            width: 3px;
            height: calc(var(--iphone-width) * 0.04);
        }

        .power-button {
            right: -3px;
            top: 22%;
            width: 3px;
            height: calc(var(--iphone-width) * 0.12);
        }

        /* Ekran */
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: calc(var(--border-radius) - var(--bezel));
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: calc(var(--iphone-width) * 0.035);
            left: 50%;
            transform: translateX(-50%);
            width: var(--dynamic-island-width);
            height: var(--dynamic-island-height);
            background: #000;
            border-radius: calc(var(--dynamic-island-height) / 2);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .dynamic-island::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            border-radius: inherit;
        }

        .dynamic-island:hover {
            width: calc(var(--dynamic-island-width) * 1.3);
            height: calc(var(--dynamic-island-height) * 1.1);
        }

        .dynamic-island.expanded {
            width: calc(var(--iphone-width) * 0.9);
            height: calc(var(--iphone-width) * 0.25);
            border-radius: calc(var(--iphone-width) * 0.06);
        }

        /* Dynamic Island İçerik */
        .di-camera {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #1a1a2e 0%, #0a0a0e 100%);
            border-radius: 50%;
            border: 1.5px solid #1a1a2e;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.8);
        }

        .di-sensor {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #0f1a2e 0%, #050a15 100%);
            border-radius: 50%;
        }

        .di-content {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            color: white;
        }

        .dynamic-island.expanded .di-camera,
        .dynamic-island.expanded .di-sensor {
            display: none;
        }

        .dynamic-island.expanded .di-content {
            display: flex;
        }

        .di-music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .di-album-art {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24, #f39c12);
            border-radius: 8px;
            animation: albumPulse 2s ease-in-out infinite;
        }

        @keyframes albumPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .di-track-info h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .di-track-info p {
            font-size: 11px;
            opacity: 0.6;
        }

        .di-waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }

        .di-waveform span {
            width: 3px;
            background: #ff6b6b;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .di-waveform span:nth-child(1) { height: 30%; animation-delay: 0s; }
        .di-waveform span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
        .di-waveform span:nth-child(3) { height: 100%; animation-delay: 0.2s; }
        .di-waveform span:nth-child(4) { height: 70%; animation-delay: 0.3s; }
        .di-waveform span:nth-child(5) { height: 40%; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.5); }
        }

        /* Wallpaper */
        .wallpaper {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(120, 80, 200, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(255, 100, 100, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(50, 150, 255, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
        }

        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(var(--iphone-width) * 0.14);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: calc(var(--iphone-width) * 0.045) calc(var(--iphone-width) * 0.07) 0;
            color: white;
            font-size: 14px;
            font-weight: 600;
            z-index: 50;
        }

        .status-left {
            display: flex;
            align-items: center;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .signal-bars {
            display: flex;
            gap: 1.5px;
            align-items: flex-end;
            height: 12px;
        }

        .signal-bars span {
            width: 3px;
            background: white;
            border-radius: 1px;
        }

        .signal-bars span:nth-child(1) { height: 25%; }
        .signal-bars span:nth-child(2) { height: 50%; }
        .signal-bars span:nth-child(3) { height: 75%; }
        .signal-bars span:nth-child(4) { height: 100%; }

        .battery {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .battery-body {
            width: 24px;
            height: 11px;
            border: 1.5px solid white;
            border-radius: 3px;
            padding: 1.5px;
            position: relative;
        }

        .battery-body::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 5px;
            background: white;
            border-radius: 0 1px 1px 0;
        }

        .battery-level {
            height: 100%;
            width: 80%;
            background: #30d158;
            border-radius: 1.5px;
        }

        /* Ana Ekran İçeriği */
        .home-screen {
            position: absolute;
            inset: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .home-screen.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* Saat ve Tarih Widget */
        .time-widget {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 10;
        }

        .time {
            font-size: calc(var(--iphone-width) * 0.2);
            font-weight: 200;
            letter-spacing: -2px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .date {
            font-size: calc(var(--iphone-width) * 0.045);
            font-weight: 500;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Widgets */
        .widgets-container {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .widget {
            width: calc(var(--iphone-width) * 0.42);
            height: calc(var(--iphone-width) * 0.42);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 14px;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .widget-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .widget-icon {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .weather-icon { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .music-icon { background: linear-gradient(135deg, #fd79a8, #e84393); }

        .weather-temp {
            font-size: 36px;
            font-weight: 300;
        }

        .weather-desc {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .music-playing {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .music-album {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-radius: 10px;
        }

        .music-info h4 {
            font-size: 13px;
            font-weight: 600;
        }

        .music-info p {
            font-size: 11px;
            opacity: 0.7;
        }

        /* Home Indicator */
        .home-indicator {
            position: absolute;
            bottom: calc(var(--iphone-width) * 0.025);
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--iphone-width) * 0.36);
            height: 5px;
            background: rgba(255,255,255,0.6);
            border-radius: 3px;
            z-index: 100;
            cursor: pointer;
        }

        /* Dock */
        .dock {
            position: absolute;
            bottom: calc(var(--iphone-width) * 0.055);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 50;
        }

        .dock-icon {
            width: calc(var(--iphone-width) * 0.14);
            height: calc(var(--iphone-width) * 0.14);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .dock-icon:active {
            transform: scale(0.9);
        }

        .phone-icon { background: linear-gradient(135deg, #00c853, #00e676); }
        .safari-icon { background: linear-gradient(135deg, #2196f3, #03a9f4); }
        .messages-icon { background: linear-gradient(135deg, #4caf50, #8bc34a); }
        .whatsapp-icon { 
            background: linear-gradient(135deg, #25d366, #128c7e); 
            position: relative;
        }

        /* WhatsApp Tooltip Baloncuk */
        .whatsapp-tooltip {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            animation: tooltipBounce 2s ease-in-out infinite;
            z-index: 1000;
        }

        .whatsapp-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: #128c7e;
        }

        .whatsapp-tooltip::before {
            content: '👆';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            animation: fingerPoint 1s ease-in-out infinite;
        }

        @keyframes tooltipBounce {
            0%, 100% { 
                transform: translateX(-50%) translateY(0); 
            }
            50% { 
                transform: translateX(-50%) translateY(-8px); 
            }
        }

        @keyframes fingerPoint {
            0%, 100% { 
                transform: translateX(-50%) translateY(0); 
            }
            50% { 
                transform: translateX(-50%) translateY(5px); 
            }
        }

        /* Pulse Ring Animation */
        .whatsapp-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            background: rgba(37, 211, 102, 0.4);
            animation: pulseRing 1.5s ease-out infinite;
            z-index: -1;
        }

        .whatsapp-icon::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 24px;
            background: rgba(37, 211, 102, 0.2);
            animation: pulseRing 1.5s ease-out infinite 0.3s;
            z-index: -2;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        /* Yansıma Efekti */
        .screen-reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(
                180deg,
                rgba(255,255,255,0.03) 0%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 200;
        }

        /* ==================== */
        /* WHATSAPP UYGULAMASI */
        /* ==================== */
        .whatsapp-app {
            position: absolute;
            inset: 0;
            background: #111b21;
            z-index: 90;
            display: none;
            flex-direction: column;
            border-radius: calc(var(--border-radius) - var(--bezel));
            overflow: hidden;
            animation: appOpen 0.3s ease;
        }

        .whatsapp-app.active {
            display: flex;
        }

        @keyframes appOpen {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Senaryo Ekranı */
        .scenario-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding-top: calc(var(--iphone-width) * 0.14);
        }

        .scenario-header {
            background: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scenario-header .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #25d366);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 0 2px #00a884;
        }

        .scenario-header .info {
            flex: 1;
        }

        .scenario-header .info h3 {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        .scenario-header .info p {
            color: #8696a0;
            font-size: 12px;
        }

        .scenario-header .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .scenario-header .close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .scenario-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scenario-item {
            background: #202c33;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            width: 100%;
            text-align: left;
        }

        .scenario-item:hover {
            background: #2a3942;
            transform: scale(1.02);
        }

        .scenario-item:active {
            transform: scale(0.98);
        }

        .scenario-item .icon {
            font-size: 24px;
        }

        .scenario-item .text h4 {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .scenario-item .text p {
            color: #8696a0;
            font-size: 12px;
        }

        /* Chat Ekranı */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #0b141a;
            padding-top: calc(var(--iphone-width) * 0.14);
        }

        .chat-header {
            background: #202c33;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .chat-header .profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #25d366);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .chat-header .info {
            flex: 1;
            min-width: 0;
        }

        .chat-header .info h3 {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        .chat-header .info p {
            color: #8696a0;
            font-size: 11px;
        }

        .chat-header .info p.typing {
            color: #00a884;
        }

        .chat-header .actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-header .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .chat-header .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Chat Bubbles */
        .message {
            max-width: 85%;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
        }

        .message.bot {
            margin-right: auto;
        }

        .message .bubble {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.user .bubble {
            background: #005c4b;
            color: white;
            border-top-right-radius: 2px;
        }

        .message.bot .bubble {
            background: #202c33;
            color: #e9edef;
            border-top-left-radius: 2px;
        }

        .message .time {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            text-align: right;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .message .time .check {
            color: #53bdeb;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: #202c33;
            border-radius: 8px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #8696a0;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Demo Actions */
        .demo-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            padding-bottom: 8px;
        }

        .demo-actions .restart-btn {
            width: 100%;
            padding: 10px;
            background: #00a884;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .demo-actions .restart-btn:hover {
            background: #00997a;
        }

        .demo-actions .contact-btn {
            width: 100%;
            padding: 10px;
            background: #202c33;
            color: #00a884;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .demo-actions .contact-btn:hover {
            background: #2a3942;
        }

        /* Input Area */
        .input-area {
            background: #202c33;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-area .input-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #8696a0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .input-area .input-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .input-area .input-field {
            flex: 1;
            background: #2a3942;
            border-radius: 20px;
            padding: 8px 14px;
            color: #8696a0;
            font-size: 13px;
        }

        /* Info Text */
        .info-text {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="iphone-container">
        <div class="iphone-frame">

            <div class="side-button silent-switch"></div>
            <div class="side-button volume-up"></div>

            <div class="iphone-screen">

                <!-- Dynamic Island -->

                    <div class="di-content">
                        <div class="di-music-info">

                                <h4>Blinding Lights</h4>

                            </div>
                        </div>
                        <div class="di-waveform">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                </div>

                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-left">
                        <span id="status-time">21:45</span>

                    <div class="status-right">
                        <div class="signal-bars">
                            <span></span>

                </div>

                <!-- Ana Ekran -->
                <div class="home-screen" id="homeScreen">
                    <!-- Saat Widget -->
                    <div class="time-widget">
                        <div class="time" id="main-time">21:45</div>
                        <div class="date" id="main-date">Salı, 17 Aralık</div>
                    </div>

                    <!-- Widgets -->
                    <div class="widgets-container">
                        <div class="widget">
                            <div class="widget-header">
                                <div class="widget-icon weather-icon">☀️</div>

                            <div class="weather-temp">18°</div>
                            <div class="weather-desc">Açık, H:22° L:14°</div>
                        </div>
                        <div class="widget">
                            <div class="widget-header">
                                <div class="widget-icon music-icon">🎵</div>
                                <span>Müzik</span>
                            </div>
                            <div class="music-playing">
                                <div class="music-album"></div>
                                <div class="music-info">
                                    <h4>Şimdi Çalıyor</h4>
                                    <p>Blinding Lights</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Dock -->
                    <div class="dock">
                        <div class="dock-icon phone-icon">📞</div>
                        <div class="dock-icon safari-icon">🧭</div>
                        <div class="dock-icon messages-icon">💬</div>
                        <div class="dock-icon whatsapp-icon" onclick="openWhatsApp()" id="whatsappIcon">
                            <span class="whatsapp-tooltip">Demo'yu Başlat!</span>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- WhatsApp Uygulaması -->
                <div class="whatsapp-app" id="whatsappApp">
                    <!-- Senaryo Seçim Ekranı -->
                    <div class="scenario-screen" id="scenarioScreen">
                        <div class="scenario-header">
                            <div class="logo">🤖</div>
                            <div class="info">
                                <h3>Allync AI</h3>
                                <p>Senaryo Seçin</p>
                            </div>
                            <button class="close-btn" onclick="closeWhatsApp()">✕</button>
                        </div>

                        <div class="scenario-list">
                            <button class="scenario-item" onclick="selectScenario('appointment')">
                                <span class="icon">📅</span>
                                <div class="text">
                                    <h4>Randevu Alma</h4>
                                    <p>6 mesaj</p>
                                </div>
                            </button>

                            <button class="scenario-item" onclick="selectScenario('pricing')">
                                <span class="icon">💰</span>
                                <div class="text">
                                    <h4>Fiyat Bilgisi</h4>
                                    <p>2 mesaj</p>
                                </div>
                            </button>

                            <button class="scenario-item" onclick="selectScenario('greeting')">
                                <span class="icon">👋</span>
                                <div class="text">
                                    <h4>Selamlama</h4>
                                    <p>2 mesaj</p>
                                </div>
                            </button>

                            <button class="scenario-item" onclick="selectScenario('company')">
                                <span class="icon">📍</span>
                                <div class="text">
                                    <h4>Şirket Bilgileri</h4>
                                    <p>2 mesaj</p>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- Chat Ekranı -->
                    <div class="chat-screen" id="chatScreen">
                        <div class="chat-header">
                            <button class="back-btn" onclick="goBack()">←</button>
                            <div class="profile">🤖</div>
                            <div class="info">
                                <h3>Allync AI</h3>
                                <p id="statusText">çevrimiçi</p>
                            </div>
                            <div class="actions">
                                <button class="action-btn">📹</button>
                                <button class="action-btn">📞</button>
                                <button class="action-btn" onclick="closeWhatsApp()">✕</button>
                            </div>
                        </div>

                        <div class="chat-area" id="chatArea"></div>

                        <div class="input-area">
                            <button class="input-btn">😊</button>
                            <button class="input-btn">📎</button>
                            <div class="input-field">Mesaj yazın</div>
                            <button class="input-btn">🎤</button>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator -->
                <div class="home-indicator" onclick="closeWhatsApp()"></div>

                <!-- Ekran Yansıması -->
                <div class="screen-reflection"></div>
            </div>
        </div>
    </div>

    <div class="info-text">iPhone 15 Pro Mockup</div>

    <script>
        // Saat güncelleme
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            
            document.getElementById('main-time').textContent = timeStr;
            document.getElementById('status-time').textContent = timeStr;
            
            const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
            const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 
                           'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
            
            const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
            document.getElementById('main-date').textContent = dateStr;
        }
        
        updateTime();
        setInterval(updateTime, 1000);

        // Dynamic Island toggle
        function toggleDynamicIsland(element) {
            element.classList.toggle('expanded');
        }

        // WhatsApp Uygulaması
        function openWhatsApp() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('whatsappApp').classList.add('active');
            // Tooltip'i gizle
            const tooltip = document.querySelector('.whatsapp-tooltip');
            if (tooltip) tooltip.style.display = 'none';
        }

        function closeWhatsApp() {
            document.getElementById('whatsappApp').classList.remove('active');
            document.getElementById('homeScreen').classList.remove('hidden');
            // Ekranları sıfırla
            document.getElementById('scenarioScreen').style.display = 'flex';
            document.getElementById('chatScreen').style.display = 'none';
            // Tooltip'i tekrar göster
            const tooltip = document.querySelector('.whatsapp-tooltip');
            if (tooltip) tooltip.style.display = 'block';
        }

        // Senaryolar
        const scenarios = {
            appointment: [
                { type: 'user', content: 'Merhaba, randevu almak istiyorum' },
                { type: 'bot', content: 'Merhaba! 👋 Randevu almak istediğiniz için teşekkürler. Hangi hizmet için randevu almak istersiniz?' },
                { type: 'user', content: 'Saç kesimi için' },
                { type: 'bot', content: 'Harika seçim! Saç kesimi için müsait zamanlarımız:\n\n📅 Yarın 10:00\n📅 Yarın 14:00\n📅 Perşembe 11:00\n\nHangisi size uygun?' },
                { type: 'user', content: 'Yarın 14:00 olsun' },
                { type: 'bot', content: 'Mükemmel! ✅ Randevunuz onaylandı:\n\n📅 Tarih: Yarın\n⏰ Saat: 14:00\n✂️ Hizmet: Saç Kesimi\n\nGörüşmek üzere!' }
            ],
            pricing: [
                { type: 'user', content: 'Fiyat listesi alabilir miyim?' },
                { type: 'bot', content: 'Tabii ki! İşte güncel fiyat listemiz:\n\n💈 Saç Kesimi: 150₺\n🧔 Sakal Tıraşı: 80₺\n💇 Saç + Sakal: 200₺\n🎨 Saç Boyama: 300₺\n\nBaşka bir sorunuz var mı?' }
            ],
            greeting: [
                { type: 'user', content: 'Merhaba' },
                { type: 'bot', content: 'Merhaba! 👋 Allync AI\'ya hoş geldiniz! Size nasıl yardımcı olabilirim?\n\n📅 Randevu al\n💰 Fiyat bilgisi\n📍 Konum bilgisi\n❓ Soru sor' }
            ],
            company: [
                { type: 'user', content: 'Adresiniz nedir?' },
                { type: 'bot', content: 'Bizi şu adreste bulabilirsiniz:\n\n📍 Atatürk Cad. No:123\n🏢 Merkez / İstanbul\n\n⏰ Çalışma Saatleri:\nPzt-Cum: 09:00-19:00\nCmt: 10:00-17:00\nPzr: Kapalı\n\n📞 0212 123 45 67' }
            ]
        };

        let currentMessages = [];
        let messageIndex = 0;

        function selectScenario(type) {
            document.getElementById('scenarioScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';

            currentMessages = scenarios[type];
            messageIndex = 0;
            document.getElementById('chatArea').innerHTML = '';

            playMessages();
        }

        function playMessages() {
            if (messageIndex >= currentMessages.length) {
                showDemoActions();
                return;
            }

            const msg = currentMessages[messageIndex];

            if (msg.type === 'bot') {
                document.getElementById('statusText').textContent = 'yazıyor...';
                document.getElementById('statusText').classList.add('typing');
                showTypingIndicator();

                setTimeout(() => {
                    hideTypingIndicator();
                    document.getElementById('statusText').textContent = 'çevrimiçi';
                    document.getElementById('statusText').classList.remove('typing');
                    addMessage(msg);
                    messageIndex++;
                    setTimeout(playMessages, 1000);
                }, 1000);
            } else {
                addMessage(msg);
                messageIndex++;
                setTimeout(playMessages, 800);
            }
        }

        function addMessage(msg) {
            const chatArea = document.getElementById('chatArea');
            const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.type}`;
            messageDiv.innerHTML = `
                <div class="bubble">${msg.content.replace(/\n/g, '<br>')}</div>
                <div class="time">
                    ${time}
                    ${msg.type === 'user' ? '<span class="check">✓✓</span>' : ''}
                </div>
            `;

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typing = document.createElement('div');
            typing.id = 'typingIndicator';
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatArea.appendChild(typing);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function showDemoActions() {
            const chatArea = document.getElementById('chatArea');
            const actions = document.createElement('div');
            actions.className = 'demo-actions';
            actions.innerHTML = `
                <button class="restart-btn" onclick="restartDemo()">🔄 Tekrar Oynat</button>
                <button class="contact-btn" onclick="closeWhatsApp()">🏠 Ana Ekrana Dön</button>
            `;
            chatArea.appendChild(actions);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function restartDemo() {
            messageIndex = 0;
            document.getElementById('chatArea').innerHTML = '';
            playMessages();
        }

        function goBack() {
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('scenarioScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
