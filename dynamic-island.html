<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Island - Smooth Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #000000 0%, #1a1a2e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            gap: 40px;
        }

        .phone-top {
            position: relative;
            width: 380px;
            height: 200px;
            background: linear-gradient(180deg, #0a0a0f 0%, #12121a 100%);
            border-radius: 45px 45px 20px 20px;
            display: flex;
            justify-content: center;
            padding-top: 14px;
            box-shadow: 
                0 0 0 3px #2a2a2e,
                0 20px 60px rgba(0,0,0,0.5);
        }

        /* ==================== */
        /* DYNAMIC ISLAND */
        /* ==================== */
        .dynamic-island {
            position: relative;
            width: 120px;
            height: 36px;
            background: #000000;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* SMOOTH TRANSİTİON - Ana sır burada */
            transition: 
                width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                border-radius 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* GPU Acceleration */
            will-change: width, height, border-radius;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* Parlak kenar efekti */
        .dynamic-island::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(
                135deg, 
                rgba(255,255,255,0.1) 0%, 
                transparent 40%,
                transparent 60%,
                rgba(255,255,255,0.05) 100%
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Hover State */
        .dynamic-island:hover:not(.expanded) {
            width: 140px;
            height: 38px;
        }

        /* Expanded State */
        .dynamic-island.expanded {
            width: 340px;
            height: 90px;
            border-radius: 35px;
        }

        /* ==================== */
        /* İÇERİK - Collapsed */
        /* ==================== */
        .di-collapsed {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 14px;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .dynamic-island.expanded .di-collapsed {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .di-camera {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 35% 35%, #1a1a3e 0%, #050508 100%);
            border-radius: 50%;
            border: 1.5px solid #1a1a2a;
            box-shadow: 
                inset 0 1px 2px rgba(0,0,0,0.8),
                0 0 3px rgba(50, 50, 100, 0.3);
        }

        .di-sensor {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #0a0a1a 0%, #000005 100%);
            border-radius: 50%;
            box-shadow: 0 0 2px rgba(0, 100, 100, 0.2);
        }

        /* ==================== */
        /* İÇERİK - Expanded */
        /* ==================== */
        .di-expanded {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            opacity: 0;
            transform: scale(0.9);
            transition: 
                opacity 0.3s ease 0.15s,
                transform 0.3s ease 0.15s;
            position: absolute;
            pointer-events: none;
        }

        .dynamic-island.expanded .di-expanded {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Müzik Sol Taraf */
        .music-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .album-art {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #f39c12 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            transition: transform 0.3s ease;
        }

        .dynamic-island.expanded:hover .album-art {
            transform: scale(1.05);
        }

        .track-info {
            color: white;
        }

        .track-info h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
            letter-spacing: -0.3px;
        }

        .track-info p {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
        }

        /* Müzik Sağ Taraf - Waveform */
        .music-right {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 35px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(180deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 3px;
            animation: waveAnim 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 65%; animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { height: 100%; animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { height: 75%; animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { height: 45%; animation-delay: 0.6s; }

        @keyframes waveAnim {
            0%, 100% { 
                transform: scaleY(1); 
            }
            50% { 
                transform: scaleY(0.4); 
            }
        }

        /* ==================== */
        /* KONTROLLER */
        /* ==================== */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .control-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: linear-gradient(135deg, #25d366, #128c7e);
            border-color: transparent;
        }

        /* Info */
        .info {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            text-align: center;
        }

        .info span {
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="phone-top">
        <div class="dynamic-island" id="dynamicIsland" onclick="toggleIsland()">
            <!-- Collapsed İçerik -->
            <div class="di-collapsed">
                <div class="di-camera"></div>
                <div class="di-sensor"></div>
            </div>

            <!-- Expanded İçerik -->
            <div class="di-expanded">
                <div class="music-left">
                    <div class="album-art"></div>
                    <div class="track-info">
                        <h4>Blinding Lights</h4>
                        <p>The Weeknd</p>
                    </div>
                </div>
                <div class="music-right">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="toggleIsland()">Toggle</button>
        <button class="control-btn" onclick="setSize('small')">Small</button>
        <button class="control-btn" onclick="setSize('medium')">Medium</button>
        <button class="control-btn active" onclick="setSize('large')">Large (Music)</button>
    </div>

    <div class="info">
        <p>Dynamic Island'a <span>tıklayın</span> veya <span>hover</span> yapın</p>
        <p style="margin-top: 8px;">Transition: <span>0.5s cubic-bezier(0.4, 0, 0.2, 1)</span></p>
    </div>

    <script>
        const island = document.getElementById('dynamicIsland');
        let isExpanded = false;

        function toggleIsland() {
            isExpanded = !isExpanded;
            island.classList.toggle('expanded', isExpanded);
        }

        function setSize(size) {
            // Butonları güncelle
            document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Önce expanded class'ı kaldır
            island.classList.remove('expanded');
            isExpanded = false;

            // Custom boyutlar
            switch(size) {
                case 'small':
                    island.style.width = '100px';
                    island.style.height = '32px';
                    island.style.borderRadius = '16px';
                    break;
                case 'medium':
                    island.style.width = '160px';
                    island.style.height = '36px';
                    island.style.borderRadius = '18px';
                    break;
                case 'large':
                    island.style.width = '';
                    island.style.height = '';
                    island.style.borderRadius = '';
                    setTimeout(() => {
                        island.classList.add('expanded');
                        isExpanded = true;
                    }, 50);
                    break;
            }
        }
    </script>
</body>
</html>
