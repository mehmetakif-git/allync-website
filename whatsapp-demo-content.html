<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Demo İçeriği</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b141a;
            min-height: 100vh;
        }

        /* WhatsApp Demo Container - iPhone içine sığacak */
        .whatsapp-demo {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111b21;
        }

        /* ==================== */
        /* EKRAN 1: SENARYO SEÇİM */
        /* ==================== */
        .scenario-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .scenario-header {
            background: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scenario-header .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #25d366);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 0 2px #00a884;
        }

        .scenario-header .info {
            flex: 1;
        }

        .scenario-header .info h3 {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        .scenario-header .info p {
            color: #8696a0;
            font-size: 12px;
        }

        .scenario-header .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .scenario-header .close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .scenario-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scenario-item {
            background: #202c33;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            width: 100%;
            text-align: left;
        }

        .scenario-item:hover {
            background: #2a3942;
            transform: scale(1.02);
        }

        .scenario-item:active {
            transform: scale(0.98);
        }

        .scenario-item .icon {
            font-size: 24px;
        }

        .scenario-item .text h4 {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .scenario-item .text p {
            color: #8696a0;
            font-size: 12px;
        }

        /* ==================== */
        /* EKRAN 2: CHAT EKRANI */
        /* ==================== */
        .chat-screen {
            display: none; /* Varsayılan olarak gizli */
            flex-direction: column;
            height: 100%;
            background: #0b141a;
        }

        .chat-header {
            background: #202c33;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .chat-header .profile {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #25d366);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            box-shadow: 0 0 0 2px #00a884;
            flex-shrink: 0;
        }

        .chat-header .info {
            flex: 1;
            min-width: 0;
        }

        .chat-header .info h3 {
            color: white;
            font-size: 15px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-header .info p {
            color: #8696a0;
            font-size: 11px;
        }

        .chat-header .info p.typing {
            color: #00a884;
        }

        .chat-header .actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-header .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #aebac1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Chat Bubbles */
        .message {
            max-width: 85%;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
        }

        .message.bot {
            margin-right: auto;
        }

        .message .bubble {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        .message.user .bubble {
            background: #005c4b;
            color: white;
            border-top-right-radius: 2px;
        }

        .message.bot .bubble {
            background: #202c33;
            color: #e9edef;
            border-top-left-radius: 2px;
        }

        .message .time {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            text-align: right;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .message .time .check {
            color: #53bdeb;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: #202c33;
            border-radius: 8px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8696a0;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Quick Reply Buttons */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .quick-reply-btn {
            background: transparent;
            border: 1px solid #00a884;
            color: #00a884;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover {
            background: #00a884;
            color: white;
        }

        /* Demo Completed Actions */
        .demo-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            padding-bottom: 8px;
        }

        .demo-actions .restart-btn {
            width: 100%;
            padding: 10px;
            background: #00a884;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .demo-actions .restart-btn:hover {
            background: #00997a;
        }

        .demo-actions .contact-btn {
            width: 100%;
            padding: 10px;
            background: #202c33;
            color: #00a884;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .demo-actions .contact-btn:hover {
            background: #2a3942;
        }

        /* Input Area */
        .input-area {
            background: #202c33;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area .input-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: #8696a0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .input-area .input-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .input-area .input-field {
            flex: 1;
            background: #2a3942;
            border-radius: 20px;
            padding: 8px 16px;
            color: #8696a0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="whatsapp-demo">

        <!-- EKRAN 1: SENARYO SEÇİM EKRANI -->
        <div class="scenario-screen" id="scenarioScreen">
            <!-- Header -->
            <div class="scenario-header">
                <div class="logo">🤖</div>
                <div class="info">
                    <h3>Allync AI</h3>
                    <p>Senaryo Seçin</p>
                </div>
                <button class="close-btn" onclick="closeDemo()">✕</button>
            </div>

            <!-- Senaryo Listesi -->
            <div class="scenario-list">
                <button class="scenario-item" onclick="selectScenario('appointment')">
                    <span class="icon">📅</span>
                    <div class="text">
                        <h4>Randevu Alma</h4>
                        <p>8 mesaj</p>
                    </div>
                </button>

                <button class="scenario-item" onclick="selectScenario('pricing')">
                    <span class="icon">💰</span>
                    <div class="text">
                        <h4>Fiyat Bilgisi</h4>
                        <p>8 mesaj</p>
                    </div>
                </button>

                <button class="scenario-item" onclick="selectScenario('greeting')">
                    <span class="icon">👋</span>
                    <div class="text">
                        <h4>Selamlama</h4>
                        <p>8 mesaj</p>
                    </div>
                </button>

                <button class="scenario-item" onclick="selectScenario('company')">
                    <span class="icon">📍</span>
                    <div class="text">
                        <h4>Şirket Bilgileri</h4>
                        <p>8 mesaj</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- EKRAN 2: CHAT EKRANI -->
        <div class="chat-screen" id="chatScreen">
            <!-- Header -->
            <div class="chat-header">
                <button class="back-btn" onclick="goBack()">←</button>
                <div class="profile">🤖</div>
                <div class="info">
                    <h3>Allync AI</h3>
                    <p id="statusText">çevrimiçi</p>
                </div>
                <div class="actions">
                    <button class="action-btn">📹</button>
                    <button class="action-btn">📞</button>
                    <button class="action-btn">⋮</button>
                    <button class="action-btn" onclick="closeDemo()">✕</button>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <!-- Mesajlar buraya dinamik olarak eklenir -->
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <button class="input-btn">😊</button>
                <button class="input-btn">📎</button>
                <div class="input-field">Mesaj yazın</div>
                <button class="input-btn">🎤</button>
            </div>
        </div>

    </div>

    <script>
        // Örnek mesajlar
        const scenarios = {
            appointment: [
                { type: 'user', content: 'Merhaba, randevu almak istiyorum' },
                { type: 'bot', content: 'Merhaba! 👋 Randevu almak istediğiniz için teşekkürler. Hangi hizmet için randevu almak istersiniz?' },
                { type: 'user', content: 'Saç kesimi için' },
                { type: 'bot', content: 'Harika seçim! Saç kesimi için müsait zamanlarımız:\n\n📅 Yarın 10:00\n📅 Yarın 14:00\n📅 Perşembe 11:00\n\nHangisi size uygun?' },
                { type: 'user', content: 'Yarın 14:00 olsun' },
                { type: 'bot', content: 'Mükemmel! ✅ Randevunuz onaylandı:\n\n📅 Tarih: Yarın\n⏰ Saat: 14:00\n✂️ Hizmet: Saç Kesimi\n\nGörüşmek üzere!' }
            ],
            pricing: [
                { type: 'user', content: 'Fiyat listesi alabilir miyim?' },
                { type: 'bot', content: 'Tabii ki! İşte güncel fiyat listemiz:\n\n💈 Saç Kesimi: 150₺\n🧔 Sakal Tıraşı: 80₺\n💇 Saç + Sakal: 200₺\n🎨 Saç Boyama: 300₺\n\nBaşka bir sorunuz var mı?' }
            ],
            greeting: [
                { type: 'user', content: 'Merhaba' },
                { type: 'bot', content: 'Merhaba! 👋 Allync AI\'ya hoş geldiniz! Size nasıl yardımcı olabilirim?\n\n📅 Randevu al\n💰 Fiyat bilgisi\n📍 Konum bilgisi\n❓ Soru sor' }
            ],
            company: [
                { type: 'user', content: 'Adresiniz nedir?' },
                { type: 'bot', content: 'Bizi şu adreste bulabilirsiniz:\n\n📍 Atatürk Cad. No:123\n🏢 Merkez / İstanbul\n\n⏰ Çalışma Saatleri:\nPzt-Cum: 09:00-19:00\nCmt: 10:00-17:00\nPzr: Kapalı\n\n📞 0212 123 45 67' }
            ]
        };

        let currentMessages = [];
        let messageIndex = 0;

        function selectScenario(type) {
            document.getElementById('scenarioScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';

            currentMessages = scenarios[type];
            messageIndex = 0;
            document.getElementById('chatArea').innerHTML = '';

            playMessages();
        }

        function playMessages() {
            if (messageIndex >= currentMessages.length) {
                // Demo tamamlandı - action butonları göster
                showDemoActions();
                return;
            }

            const msg = currentMessages[messageIndex];

            if (msg.type === 'bot') {
                // Typing göster
                document.getElementById('statusText').textContent = 'yazıyor...';
                document.getElementById('statusText').classList.add('typing');
                showTypingIndicator();

                setTimeout(() => {
                    hideTypingIndicator();
                    document.getElementById('statusText').textContent = 'çevrimiçi';
                    document.getElementById('statusText').classList.remove('typing');
                    addMessage(msg);
                    messageIndex++;
                    setTimeout(playMessages, 1000);
                }, 1000);
            } else {
                addMessage(msg);
                messageIndex++;
                setTimeout(playMessages, 800);
            }
        }

        function addMessage(msg) {
            const chatArea = document.getElementById('chatArea');
            const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.type}`;
            messageDiv.innerHTML = `
                <div class="bubble">${msg.content.replace(/\n/g, '<br>')}</div>
                <div class="time">
                    ${time}
                    ${msg.type === 'user' ? '<span class="check">✓✓</span>' : ''}
                </div>
            `;

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typing = document.createElement('div');
            typing.id = 'typingIndicator';
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatArea.appendChild(typing);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function showDemoActions() {
            const chatArea = document.getElementById('chatArea');
            const actions = document.createElement('div');
            actions.className = 'demo-actions';
            actions.innerHTML = `
                <button class="restart-btn" onclick="restartDemo()">🔄 Tekrar Oynat</button>
                <button class="contact-btn" onclick="contactUs()">📞 İletişime Geç</button>
            `;
            chatArea.appendChild(actions);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function restartDemo() {
            messageIndex = 0;
            document.getElementById('chatArea').innerHTML = '';
            playMessages();
        }

        function goBack() {
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('scenarioScreen').style.display = 'flex';
        }

        function closeDemo() {
            alert('Demo kapatıldı! (Gerçek uygulamada modal kapanır)');
        }

        function contactUs() {
            alert('İletişim sayfasına yönlendirme! (Gerçek uygulamada contact form açılır)');
        }
    </script>
</body>
</html>
